# Configuración de pnpm para `apps/nextjs`.
#
# No declara `packages:` a propósito: learn.tg no es un workspace, los motores
# vendorizados se consumen con `link:packages/generated/*` desde package.json.
# Este archivo existe porque pnpm 11 ya no lee el campo `pnpm` de package.json
# (overrides, onlyBuiltDependencies, patchedDependencies).

# OpenBSD/adJ: variantes WASM (no hay binarios nativos de estos paquetes).
overrides:
  '@parcel/watcher': npm:@parcel/watcher-wasm
  rollup: npm:@rollup/wasm-node
  lightningcss: npm:lightningcss-wasm
  '@tailwindcss/oxide': npm:@tailwindcss/oxide-wasm32-wasi
  qr: 0.5.5

# pnpm 11 falla con ERR_PNPM_IGNORED_BUILDS si un paquete con script de
# instalación no está aquí (reemplaza `pnpm.onlyBuiltDependencies`).
allowBuilds:
  '@pasosdejesus/m': true
  '@swc/core': true
  blake-hash: true
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

# Política de cadena de suministro de pnpm 11: no instalar versiones publicadas
# hace menos de 24 h. Los paquetes propios se excluyen para poder consumir
# `@pasosdejesus/m`, `mpdj` y `contract-test` recién publicados.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@pasosdejesus/*'

# @selfxyz/common@0.0.9 (SDK de Self Protocol) declara `node-forge` desde un
# tarball de GitHub (remicolin/forge). pnpm 10 lo instalaba; pnpm 11 lo bloquea
# por defecto (`blockExoticSubdeps`). Se permite para conservar el lockfile y el
# comportamiento que ya tenía el proyecto.
blockExoticSubdeps: false

patchedDependencies:
  next@16.3.5: patches/next@16.3.5.patch
