name: Public CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (no submodules)
        uses: actions/checkout@v4

      - name: Setup pnpm (explicit version)
        uses: pnpm/action-setup@v4
        with:
          version: '11.28.6'

      - name: Setup Node.js and Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Public Test Suite (excluding private API)
        run: |
          echo "::warning::Running public-only test suite. API tests are excluded as they require the private repository, which is handled by the GitLab CI."
          pnpm test -- --exclude **/api/**
        working-directory: ./apps/web

      - name: Run API route security audit (static, no server/DB needed)
        run: node bin/audit-api-auth.mjs
        working-directory: ./apps/web

      # R-#285: los manifiestos de motor (m-engine.generated.ts) deben cuadrar con
      # sus fuentes y su intención. Estático, sin servidor ni base de datos. Se corre
      # desde la raíz porque desde `apps/web` sólo se ve el `msip` vendorizado.
      - name: Verify engine manifests (static, no server/DB needed)
        run: cd ../.. && apps/web/bin/m eng:verify
        working-directory: ./apps/web
