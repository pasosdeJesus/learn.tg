# Workspace raíz de learn.tg: una instalación, un lockfile y versiones compartidas
# por catálogo. Ver https://gitlab.com/pasosdeJesus/m/-/work_items/53 (estructura)
# y REQ/54 §14 (tren E).
packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/generated/*'

# Versión única por dependencia: las apps escriben `"catalog:"`.
catalog:
  # ecosistema y motores
  '@pasosdejesus/m': ^0.35.0
  '@pasosdejesus/mpdj': ^0.3.0
  '@pasosdejesus/usdt': ^0.1.3
  '@pasosdejesus/contract-test': ^0.1.7
  '@pasosdejesus/edr': ^0.1.2
  # compartidas por apps/web y apps/contracts
  typescript: 5.9.3
  viem: 2.55.11
  dotenv: ^17.4.2
  ethers: ^6.17.0
  tsx: ^4.23.15
  next: 16.3.5
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

# pnpm 11 falla con ERR_PNPM_IGNORED_BUILDS si un paquete con script de
# instalación no está aquí (reemplaza `pnpm.onlyBuiltDependencies`).
allowBuilds:
  '@pasosdejesus/m': true
  '@swc/core': true
  blake-hash: true
  bufferutil: true
  esbuild: true
  keccak: true
  secp256k1: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

# Política de cadena de suministro de pnpm 11: no instalar versiones publicadas
# hace menos de 24 h. Los paquetes propios se excluyen para poder consumir
# `@pasosdejesus/m`, `mpdj` y `contract-test` recién publicados.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@pasosdejesus/*'

# @selfxyz/common@0.0.9 (SDK de Self Protocol) declara `node-forge` desde un
# tarball de GitHub. pnpm 10 lo instalaba; pnpm 11 lo bloquea por defecto.
blockExoticSubdeps: false

# OpenBSD/adJ: variantes WASM (no hay binarios nativos de estos paquetes).
overrides:
  '@parcel/watcher': npm:@parcel/watcher-wasm
  rollup: npm:@rollup/wasm-node
  lightningcss: npm:lightningcss-wasm
  '@tailwindcss/oxide': npm:@tailwindcss/oxide-wasm32-wasi
  qr: 0.5.5
  # EDR/ethereumjs 10 en OpenBSD/adJ: una sola copia de cada paquete.
  '@ethereumjs/common': ^10.1.2
  '@ethereumjs/util': ^10.1.2
  '@ethereumjs/tx': ^10.1.2
  '@pasosdejesus/m': ^0.35.0

patchedDependencies:
  next@16.3.5: apps/web/patches/next@16.3.5.patch
