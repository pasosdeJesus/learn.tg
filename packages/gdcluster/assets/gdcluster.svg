<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="70%" style="stop-color:#005A8D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003554;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Fondo circular principal (Azul Profundo) -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)"/>
  
  <!-- Red de Nodos (Clústeres) -->
  <g transform="translate(100,100) scale(0.6)">
    <!-- Nodos periféricos (Naranja) -->
    <circle cx="256" cy="100" r="35" fill="#E67E22" opacity="0.8"/>
    <circle cx="412" cy="256" r="35" fill="#E67E22" opacity="0.8"/>
    <circle cx="256" cy="412" r="35" fill="#E67E22" opacity="0.8"/>
    <circle cx="100" cy="256" r="35" fill="#E67E22" opacity="0.8"/>
    
    <!-- Nodos intermedios -->
    <circle cx="365" cy="147" r="20" fill="#E67E22" opacity="0.5"/>
    <circle cx="365" cy="365" r="20" fill="#E67E22" opacity="0.5"/>
    <circle cx="147" cy="365" r="20" fill="#E67E22" opacity="0.5"/>
    <circle cx="147" cy="147" r="20" fill="#E67E22" opacity="0.5"/>
    
    <!-- Líneas de conexión de la red (Blanco) -->
    <line x1="256" y1="100" x2="256" y2="412" stroke="white" stroke-width="5" stroke-dasharray="8 8"/>
    <line x1="100" y1="256" x2="412" y2="256" stroke="white" stroke-width="5" stroke-dasharray="8 8"/>
    <line x1="147" y1="147" x2="365" y2="365" stroke="white" stroke-width="5" stroke-dasharray="8 8"/>
    <line x1="365" y1="147" x2="147" y2="365" stroke="white" stroke-width="5" stroke-dasharray="8 8"/>
  </g>
  
  <!-- Centro: Cruz Cristiana (Blanco) -->
  <rect x="241" y="196" width="30" height="120" fill="white" rx="5" ry="5"/>
  <rect x="211" y="226" width="90" height="30" fill="white" rx="5" ry="5"/>
  
  <!-- Círculo de enfoque alrededor de la cruz (Naranja) -->
  <circle cx="256" cy="256" r="100" stroke="#E67E22" stroke-width="8" fill="none" stroke-dasharray="15 15"/>
  
  <!-- Texto (opcional para el icono, pero útil para el curso) -->
  <!-- <text x="256" y="480" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">GD CLUSTER</text> -->
</svg>
